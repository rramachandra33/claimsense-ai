[project]
name = "claimsense-mcp"
version = "0.1.0"
description = "Thin MCP server over HTTP (five read-only tools that call the ClaimSense data API with the caller's token) plus the MCP registry"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "uvicorn>=0.30",       # serves /mcp and the registry over HTTP
]

[project.optional-dependencies]
# The tests run the data API in-process, so they need its dependencies too.
dev = ["pytest>=8.0", "fastapi>=0.115", "psycopg[binary]>=3.2", "pyjwt>=2.9"]

[project.scripts]
claimsense-mcp = "claimsense_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsense_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "../api/src"]
testpaths = ["tests"]
