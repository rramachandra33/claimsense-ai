[project]
name = "claimsense-batch"
version = "0.1.0"
description = "The scheduled batch assessment: picks open claims that need an assessment and runs them on AgentCore"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.9",          # signs the batch account's short-lived token
    "boto3>=1.40",         # AgentCore and CloudWatch (newer than the Lambda runtime's copy)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsense_batch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
