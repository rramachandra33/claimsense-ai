[project]
name = "claimsense-api"
version = "0.1.0"
description = "ClaimSense data API: the single gatekeeper (token check, access rule, audit) in front of PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "mangum>=0.19",       # runs the same app on AWS Lambda (lambda_handler.py)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsense_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
