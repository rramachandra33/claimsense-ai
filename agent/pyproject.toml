[project]
name = "claimsense-agent"
version = "0.1.0"
description = "ClaimSense assessment pipeline: four agents (reader, coverage, risk, drafter) in a code-ordered run"
readme = "README.md"
requires-python = ">=3.12"

# The agents reach claim data only through the ClaimSense MCP server, over HTTP; they find its
# URL in the MCP registry. Mock mode needs nothing else: no model, no AWS.
dependencies = [
    "claimsense-mcp",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",   # the runner service (runner.py)
    "uvicorn>=0.30",
    # The bedrock brain: Claude on Amazon Bedrock through the OpenAI Agents SDK (via LiteLLM).
    "openai-agents[litellm]>=0.24",
    "boto3[crt]>=1.35",   # crt: needed for aws login credentials
]

[project.optional-dependencies]
# The tests start the data API in-process on a free port.
dev = ["pytest>=8.0", "claimsense-api"]

[project.scripts]
claimsense-agent = "claimsense_agent.cli:main"

[tool.uv.sources]
claimsense-mcp = { path = "../mcp_server", editable = true }
claimsense-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsense_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
