# ClaimSense on the EC2 instance: the same services as the root docker-compose.yml, but the images
# are pulled from ECR (built and tested by CI) instead of built here.
#
#   docker compose -f docker-compose.ec2.yml up -d      (deploy.sh does this)
#
# The console (3100) is published on all interfaces, and the security group lets in only your IP;
# the public reaches it over HTTPS through the optional caddy service (EC2_DEPLOY.md).
# PostgreSQL (5432) is published too, for the Lambda Claims API; the security group lets in only
# the Lambda's security group, and the password is generated by deploy.sh. The API, MCP server
# and runner listen on 127.0.0.1 only. AWS access (ECR pulls, Bedrock) comes from the instance
# role, so there are no keys on the box.
#
# CLAIMS_API_URL is the data API the agents use (MCP server and runner): the Lambda Claims API's
# Function URL once deploy/lambda/deploy.sh has run, the local api container until then. The
# console keeps using the local api container.
# COGNITO_POOL_ID and COGNITO_CLIENT_ID (written to .env by deploy/cognito/setup.sh) switch the
# console to Amazon Cognito sign-in; the same script sets DEV_LOGIN=0, turning the development
# sign-in off (decided 2026-11-05). Without them, the development sign-in stays.
# MCP_REGISTRY_URL is where the runner finds the MCP server: the claimsense-mcp function's
# registry once deploy/lambda/deploy.sh has run, the local mcp container until then.
#
# The seed job resets the database to the course fixtures each time the stack is (re)created.
name: claimsense

x-db-url: &db-url postgresql://claimsense:${CLAIMSENSE_DB_PASSWORD:?set in .env (deploy.sh writes one)}@db:5432/claimsense
x-restart: &restart unless-stopped

services:
  db:
    image: postgres:16
    container_name: claimsense-db
    restart: *restart
    environment:
      POSTGRES_USER: claimsense
      POSTGRES_PASSWORD: ${CLAIMSENSE_DB_PASSWORD}
      POSTGRES_DB: claimsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsense"]
      interval: 3s
      timeout: 3s
      retries: 10

  seed:
    image: ${REGISTRY}/claimsense-seed:${TAG:-latest}
    environment:
      CLAIMSENSE_DB_URL: *db-url
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${REGISTRY}/claimsense-api:${TAG:-latest}
    restart: *restart
    environment:
      CLAIMSENSE_DB_URL: *db-url
      CLAIMSENSE_JWT_SECRET: ${CLAIMSENSE_JWT_SECRET:?set in .env (deploy.sh writes one)}
      CLAIMSENSE_DEV_LOGIN: ${DEV_LOGIN:-1}
      CLAIMSENSE_COGNITO_POOL_ID: ${COGNITO_POOL_ID:-}
      CLAIMSENSE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CLAIMSENSE_RATE_LIMIT_PER_MINUTE: ${CLAIMSENSE_RATE_LIMIT_PER_MINUTE:-300}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  mcp:
    image: ${REGISTRY}/claimsense-runner:${TAG:-latest}
    restart: *restart
    command: ["claimsense-mcp"]
    environment:
      CLAIMSENSE_API_URL: ${CLAIMS_API_URL:-http://api:8000}
      CLAIMSENSE_MCP_HOST: 0.0.0.0
      CLAIMSENSE_MCP_PORT: "8200"
      CLAIMSENSE_MCP_PUBLIC_URL: http://mcp:8200/mcp
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  runner:
    image: ${REGISTRY}/claimsense-runner:${TAG:-latest}
    restart: *restart
    environment:
      CLAIMSENSE_API_URL: ${CLAIMS_API_URL:-http://api:8000}
      CLAIMSENSE_MCP_REGISTRY_URL: ${MCP_REGISTRY_URL:-http://mcp:8200/registry/v0/servers}
      CLAIMSENSE_BRAIN: ${BRAIN:-mock}
      # Set by deploy/agentcore/deploy.sh: then /runs hands each run to the AgentCore runtime.
      CLAIMSENSE_AGENTCORE_RUNTIME_ARN: ${AGENTCORE_RUNTIME_ARN:-}
      AWS_DEFAULT_REGION: us-east-1     # Bedrock credentials come from the instance role
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy

  web:
    image: ${REGISTRY}/claimsense-web:${TAG:-latest}
    restart: *restart
    environment:
      CLAIMSENSE_API_URL: http://api:8000
      CLAIMSENSE_RUNNER_URL: http://runner:8100
      # 1 behind HTTPS (SITE_DOMAIN and Caddy below); 0 while the console is reached over plain HTTP
      CLAIMSENSE_COOKIE_SECURE: ${CLAIMSENSE_COOKIE_SECURE:-0}
      CLAIMSENSE_COGNITO_POOL_ID: ${COGNITO_POOL_ID:-}
      CLAIMSENSE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      # CONSOLE_BIND=127.0.0.1 in .env once Caddy serves HTTPS: then plain HTTP on 3100 is not
      # reachable from outside the instance at all (Caddy uses the Compose network)
      - "${CONSOLE_BIND:-0.0.0.0}:3100:3100"
    depends_on:
      api:
        condition: service_healthy
      runner:
        condition: service_started

  # HTTPS in front of the console (decided 2026-11-20). Caddy gets and renews a Let's Encrypt
  # certificate for SITE_DOMAIN (an A record pointing at the Elastic IP; ports 80 and 443 open).
  # Off unless enabled: docker compose --profile https up -d --no-deps caddy
  caddy:
    image: caddy:2.8.4
    profiles: ["https"]
    restart: *restart
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}    # set in .env, e.g. claimsenseai.rajur-dev.com
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
